# Strategic merge patch for the installed manager; used by make deploy-debug.
spec:
  template:
    spec:
      containers:
        - name: manager
          image: imagescan-operator:debug
          imagePullPolicy: IfNotPresent
          command: null
          args: #args in this patch replaces the entire argument list, rather than adding individual arguments.
            - --metrics-bind-address=:8443
            - --health-probe-bind-address=:8081
            - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
            - --webhook-port=9443
          livenessProbe: null
          readinessProbe: null
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
