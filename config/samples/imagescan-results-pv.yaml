apiVersion: v1
kind: PersistentVolume
metadata:
  name: imagescan-results-pv
  #labels:
  #  release: stable
  #  environment: dev
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    name: imagescan-results-pvc
    namespace: imagescan-project-system
  hostPath:
    path: /var/local/imagescan-results
    type: DirectoryOrCreate