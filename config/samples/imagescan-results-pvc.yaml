apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: imagescan-results-pvc
  namespace: imagescan-project-system
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Gi
  storageClassName: "" # A PVC with its storageClassName set equal to "" is always interpreted to be requesting a PV with no class
  volumeName: imagescan-results-pv
