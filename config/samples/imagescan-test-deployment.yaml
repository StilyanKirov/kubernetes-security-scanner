apiVersion: apps/v1
kind: Deployment
metadata:
  name: imagescan-test-nginx
  namespace: imagescan-test
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
      imagescan-test-workload: nginx-replicas
  template:
    metadata:
      labels:
        app: web
        imagescan-test-workload: nginx-replicas
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
