apiVersion: v1
kind: Pod
metadata:
  name: imagescan-test-busybox
  namespace: imagescan-test
  labels:
    app: web
spec:
  containers:
    - name: busybox
      image: busybox:1.37
      command: ["sh", "-c", "while true; do sleep 3600; done"]
---
apiVersion: v1
kind: Pod
metadata:
  name: imagescan-test-alpine
  namespace: imagescan-test
  labels:
    app: web
spec:
  containers:
    - name: alpine
      image: alpine:3.21
      command: ["sh", "-c", "while true; do sleep 3600; done"]
