---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-scan-my-domain-v1-imagescan
  failurePolicy: Fail
  name: vimagescan-v1.kb.io
  rules:
  - apiGroups:
    - scan.my.domain
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - imagescans
  sideEffects: None
